# Static defaults. Anything environment-specific (S3 endpoint, credentials, master URL)
# is injected at runtime by libs/ecom_common/spark.py from environment variables.

# --- Delta Lake ------------------------------------------------------------
spark.sql.extensions                         io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog              org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.schema.autoMerge.enabled  false
spark.databricks.delta.optimizeWrite.enabled true
spark.databricks.delta.retentionDurationCheck.enabled true

# --- S3A / MinIO -----------------------------------------------------------
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.fast.upload              true

# --- SQL / execution -------------------------------------------------------
spark.sql.session.timeZone                   UTC
spark.sql.adaptive.enabled                   true
spark.sql.shuffle.partitions                 24
spark.serializer                             org.apache.spark.serializer.KryoSerializer
spark.sql.execution.arrow.pyspark.enabled    true

# --- Structured Streaming --------------------------------------------------
spark.sql.streaming.stateStore.providerClass org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled true
spark.sql.streaming.metricsEnabled           true

# --- Code shipped by bind-mount: executors need the same PYTHONPATH ---------
spark.executorEnv.PYTHONPATH                 /opt/app/libs:/opt/app

# --- Observability (Prometheus scrape: /metrics/prometheus on driver UI) ----
spark.ui.prometheus.enabled                  true
spark.metrics.conf                           /opt/spark/conf/metrics.properties
