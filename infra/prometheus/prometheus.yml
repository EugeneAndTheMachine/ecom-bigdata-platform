global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kafka-exporter          # topic offsets, consumer-group lag
    static_configs: [{targets: ["kafka-exporter:9308"]}]

  - job_name: clickstream-producer    # events sent / failed / DLQ / replay lag
    static_configs: [{targets: ["clickstream-producer:8001"]}]

  - job_name: spark-streaming-driver  # micro-batch duration, input rate, state size
    metrics_path: /metrics/prometheus
    static_configs: [{targets: ["spark-streaming:4040"]}]

  - job_name: spark-executors
    metrics_path: /metrics/executors/prometheus
    static_configs: [{targets: ["spark-streaming:4040"]}]

  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs: [{targets: ["spark-master:8080"]}]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: ["minio:9000"]}]

  - job_name: recommend-api           # p95 latency, request rate
    static_configs: [{targets: ["recommend-api:8000"]}]
