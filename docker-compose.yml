# =============================================================================
#  E-commerce Big Data Platform — REES46-only scope
#
#  Profiles (combine them as you need):
#    (none)  core    : postgres, minio, kafka, schema-registry, redis, clickhouse (+ init jobs)
#    stream          : kafka-connect, spark-master/worker, spark-streaming (hot path)
#    replay          : clickstream-producer (REES46 replay into Kafka)
#    batch           : hive-metastore, trino, airflow (cold path, dbt)
#    bi              : grafana, superset, jupyter
#    ml              : mlflow, recommend-api
#    obs             : prometheus, kafka-exporter, kafka-ui
#
#  Examples:
#    docker compose up -d                                  # core only
#    docker compose --profile stream --profile bi up -d    # hot path + dashboards
#    make up-all                                           # everything (>= 16 GB RAM)
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-ecom}

x-restart: &restart
  restart: unless-stopped

x-app-volumes: &app-volumes
  - ./libs:/opt/app/libs:ro
  - ./pipelines:/opt/app/pipelines
  - ./schemas:/opt/app/schemas:ro
  - ./data:/data

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: infra/spark/Dockerfile
    target: runtime
    args:
      PYTHON_VERSION: ${PYTHON_VERSION}
      SPARK_VERSION: ${SPARK_VERSION}
      DELTA_VERSION: ${DELTA_VERSION}
      SCALA_BINARY: ${SCALA_BINARY}
      HADOOP_AWS_VERSION: ${HADOOP_AWS_VERSION}
      AWS_SDK_BUNDLE_VERSION: ${AWS_SDK_BUNDLE_VERSION}
      MLFLOW_VERSION: ${MLFLOW_VERSION}
  image: ecom/spark:${SPARK_VERSION}
  env_file: .env
  volumes: *app-volumes
  networks: [platform]

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
      PYTHON_VERSION: ${PYTHON_VERSION}
      SPARK_VERSION: ${SPARK_VERSION}
      DELTA_VERSION: ${DELTA_VERSION}
      SCALA_BINARY: ${SCALA_BINARY}
      HADOOP_AWS_VERSION: ${HADOOP_AWS_VERSION}
      AWS_SDK_BUNDLE_VERSION: ${AWS_SDK_BUNDLE_VERSION}
      DBT_TRINO_VERSION: ${DBT_TRINO_VERSION}
      MLFLOW_VERSION: ${MLFLOW_VERSION}
  image: ecom/airflow:${AIRFLOW_VERSION}
  env_file: .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/app/orchestration/airflow/dags
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    AIRFLOW_CONN_TRINO_DEFAULT: '{"conn_type": "trino", "host": "trino", "port": 8080, "login": "airflow", "schema": "silver", "extra": {"catalog": "delta"}}'
    PYTHONPATH: /opt/app/libs:/opt/app:/opt/app/orchestration/airflow
    SPARK_DRIVER_HOST: airflow-scheduler
  volumes:
    - ./libs:/opt/app/libs:ro
    - ./pipelines:/opt/app/pipelines
    - ./schemas:/opt/app/schemas:ro
    - ./orchestration:/opt/app/orchestration
    - ./data:/data
    - airflow-logs:/opt/airflow/logs
  networks: [platform]
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ===========================================================================
  #  CORE
  # ===========================================================================
  postgres:
    <<: *restart
    image: ${POSTGRES_IMAGE}
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  minio:
    <<: *restart
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  minio-init:
    image: ${AWS_CLI_IMAGE}
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${S3_REGION}
    volumes: [./infra/minio/init-buckets.sh:/scripts/init-buckets.sh:ro]
    depends_on:
      minio:
        condition: service_healthy
    networks: [platform]

  kafka:
    <<: *restart
    image: ${KAFKA_IMAGE}
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    ports: ["${KAFKA_EXTERNAL_PORT}:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [platform]

  kafka-init:
    image: ${KAFKA_IMAGE}
    env_file: .env
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    volumes: [./infra/kafka/create_topics.sh:/scripts/create_topics.sh:ro]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [platform]

  schema-registry:
    <<: *restart
    image: confluentinc/cp-schema-registry:${CP_VERSION}
    hostname: schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports: ["${SCHEMA_REGISTRY_PORT}:8081"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [platform]

  redis:
    <<: *restart
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_PORT}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [platform]

  clickhouse:
    <<: *restart
    image: ${CLICKHOUSE_IMAGE}
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  # ===========================================================================
  #  STREAM (F1 ingestion sink + F4 hot path)
  # ===========================================================================
  kafka-connect:
    <<: *restart
    profiles: [stream]
    build:
      context: infra/kafka-connect
      args:
        CP_VERSION: ${CP_VERSION}
        S3_SINK_CONNECTOR_VERSION: ${S3_SINK_CONNECTOR_VERSION}
    image: ecom/kafka-connect:${CP_VERSION}
    hostname: kafka-connect
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: ecom-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["${KAFKA_CONNECT_PORT}:8083"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [platform]

  connect-init:
    profiles: [stream]
    image: curlimages/curl:8.10.1
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/register_connectors.sh"]
    volumes: [./infra/kafka-connect/register_connectors.sh:/scripts/register_connectors.sh:ro]
    depends_on:
      kafka-connect:
        condition: service_healthy
    networks: [platform]

  spark-master:
    <<: [*spark-common, *restart]
    profiles: [stream, batch, ml, bi]
    hostname: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["${SPARK_MASTER_UI_PORT}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 15s
      timeout: 5s
      retries: 10

  spark-worker:
    <<: [*spark-common, *restart]
    profiles: [stream, batch, ml, bi]
    hostname: spark-worker
    command: ["/bin/sh", "-c", "spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores $${SPARK_WORKER_CORES} --memory $${SPARK_WORKER_MEMORY} --webui-port 8081"]
    depends_on:
      spark-master:
        condition: service_healthy

  spark-streaming:
    <<: [*spark-common, *restart]
    profiles: [stream]
    hostname: spark-streaming
    command:
      - /bin/sh
      - -c
      - >-
        spark-submit --master $${SPARK_MASTER_URL}
        --name hot-path-streaming
        --conf spark.driver.host=spark-streaming
        --conf spark.driver.memory=$${SPARK_DRIVER_MEMORY}
        --conf spark.executor.memory=$${SPARK_EXECUTOR_MEMORY}
        /opt/app/pipelines/streaming/run.py --jobs $${STREAMING_JOBS}
    ports: ["${SPARK_DRIVER_UI_PORT}:4040"]
    depends_on:
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================================================
  #  REPLAY (F1 source) — needs a REES46 file under ./data/raw
  # ===========================================================================
  clickstream-producer:
    profiles: [replay]
    build:
      context: .
      dockerfile: services/clickstream-producer/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: ecom/clickstream-producer:latest
    env_file: .env
    environment:
      METRICS_PORT: 8001
    volumes:
      - ./data:/data:ro
      - ./schemas:/opt/app/schemas:ro
    ports: ["${PRODUCER_METRICS_PORT}:8001"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks: [platform]

  # ===========================================================================
  #  BATCH (F5 cold path)
  # ===========================================================================
  hive-metastore:
    <<: *restart
    profiles: [batch, bi]
    build:
      context: infra/hive-metastore
      args:
        HIVE_IMAGE: ${HIVE_IMAGE}
        HIVE_HADOOP_VERSION: ${HIVE_HADOOP_VERSION}
        HIVE_AWS_SDK_VERSION: ${HIVE_AWS_SDK_VERSION}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
    image: ecom/hive-metastore:4.0.0
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${METASTORE_DB}
        -Djavax.jdo.option.ConnectionUserName=${METASTORE_DB_USER}
        -Djavax.jdo.option.ConnectionPassword=${METASTORE_DB_PASSWORD}
    volumes:
      - ./infra/hive-metastore/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [platform]

  trino:
    <<: *restart
    profiles: [batch, bi]
    image: trinodb/trino:${TRINO_VERSION}
    hostname: trino
    env_file: .env
    ports: ["${TRINO_PORT}:8080"]
    volumes:
      - ./infra/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infra/trino/etc/catalog:/etc/trino/catalog:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    networks: [platform]

  airflow-init:
    <<: *airflow-common
    profiles: [batch]
    command: ["bash", "-c", "airflow db migrate && airflow version"]
    restart: "no"

  airflow-apiserver:
    <<: [*airflow-common, *restart]
    profiles: [batch]
    command: api-server
    ports: ["${AIRFLOW_PORT}:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: [*airflow-common, *restart]
    profiles: [batch]
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: [*airflow-common, *restart]
    profiles: [batch]
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: [*airflow-common, *restart]
    profiles: [batch]
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ===========================================================================
  #  BI / CONSUMPTION
  # ===========================================================================
  grafana:
    <<: *restart
    profiles: [bi]
    image: ${GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports: ["${GRAFANA_PORT}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [platform]

  superset:
    <<: *restart
    profiles: [bi]
    build:
      context: infra/superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION}
    image: ecom/superset:${SUPERSET_VERSION}
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports: ["${SUPERSET_PORT}:8088"]
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./infra/superset/bootstrap.sh:/app/bootstrap.sh:ro
    command: ["/bin/bash", "/app/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]

  jupyter:
    <<: *spark-common
    profiles: [bi]
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
      target: jupyter
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        SPARK_VERSION: ${SPARK_VERSION}
        DELTA_VERSION: ${DELTA_VERSION}
        SCALA_BINARY: ${SCALA_BINARY}
        HADOOP_AWS_VERSION: ${HADOOP_AWS_VERSION}
        AWS_SDK_BUNDLE_VERSION: ${AWS_SDK_BUNDLE_VERSION}
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    image: ecom/spark-jupyter:${SPARK_VERSION}
    hostname: jupyter
    command: ["/bin/sh", "-c", "jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root --IdentityProvider.token=$${JUPYTER_TOKEN} --notebook-dir=/opt/app/notebooks"]
    ports: ["${JUPYTER_PORT}:8888"]
    volumes:
      - ./libs:/opt/app/libs:ro
      - ./pipelines:/opt/app/pipelines
      - ./schemas:/opt/app/schemas:ro
      - ./notebooks:/opt/app/notebooks
      - ./data:/data

  # ===========================================================================
  #  ML (F6)
  # ===========================================================================
  mlflow:
    <<: *restart
    profiles: [ml]
    build:
      context: infra/mlflow
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    image: ecom/mlflow:${MLFLOW_VERSION}
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${S3_REGION}
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB}
      - --artifacts-destination=s3://${MLFLOW_BUCKET}
      - --serve-artifacts
    ports: ["${MLFLOW_PORT}:5000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [platform]

  recommend-api:
    <<: *restart
    profiles: [ml]
    build:
      context: services/recommend-api
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    image: ecom/recommend-api:latest
    env_file: .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["${RECOMMEND_API_PORT}:8000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [platform]

  # ===========================================================================
  #  OBSERVABILITY
  # ===========================================================================
  prometheus:
    <<: *restart
    profiles: [obs]
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["${PROMETHEUS_PORT}:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [platform]

  kafka-exporter:
    <<: *restart
    profiles: [obs]
    image: ${KAFKA_EXPORTER_IMAGE}
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [platform]

  kafka-ui:
    <<: *restart
    profiles: [obs]
    image: ${KAFKA_UI_IMAGE}
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports: ["${KAFKA_UI_PORT}:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [platform]

networks:
  platform:
    name: ecom-platform

volumes:
  pg-data:
  minio-data:
  kafka-data:
  redis-data:
  clickhouse-data:
  grafana-data:
  prometheus-data:
  airflow-logs:
