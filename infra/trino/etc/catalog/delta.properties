# Delta Lake catalog = the lakehouse (bronze / silver / gold / ml schemas)
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083

fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Spark writes tables by path; Trino registers them (CALL delta.system.register_table)
delta.register-table-procedure.enabled=true
# Required for writes (dbt) to S3-compatible storage without a lock service
delta.enable-non-concurrent-writes=true
